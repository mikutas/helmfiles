apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/check-deprecated-apis/check-deprecated-apis.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/disallow-cri-sock-mount/disallow-cri-sock-mount.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/disallow-default-namespace/disallow-default-namespace.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/disallow-empty-ingress-host/disallow-empty-ingress-host.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/disallow-latest-tag/disallow-latest-tag.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/require-labels/require-labels.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/require-pod-requests-limits/require-pod-requests-limits.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/require-probes/require-probes.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/require-ro-rootfs/require-ro-rootfs.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/restrict-node-port/restrict-node-port.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/restrict-service-external-ips/restrict-service-external-ips.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/topologyspreadconstraints-policy/topologyspreadconstraints-policy.yaml
  # pod-security-vpol/baseline配下はPSS baseline相当12項目のうち10項目をカバー
  # 残り2項目はkyverno/policies側に借用元が無く未対応:
  # - AppArmor Profile: ClusterPolicy版(pod-security/baseline/restrict-apparmor-profiles)はあるが、ValidatingPolicy(pod-security-vpol)未移植
  # - Host Probes and Host Lifecycle: ClusterPolicy/CEL/ValidatingPolicyいずれの形式でも未実装
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-capabilities/disallow-capabilities.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-host-namespaces/disallow-host-namespaces.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-host-path/disallow-host-path.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-host-ports/disallow-host-ports.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-host-process/disallow-host-process.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-privileged-containers/disallow-privileged-containers.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-proc-mount/disallow-proc-mount.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-selinux/disallow-selinux.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/restrict-seccomp/restrict-seccomp.yaml
  - https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/restrict-sysctls/restrict-sysctls.yaml
  - ./ephemeralcontainers

# 名前に-ephemeralcontainersが付くものは./ephemeralcontainersが生成するpods/ephemeralcontainers専用ポリシーで、
# pods用と同じカスタマイズを両方に適用している(この分離が不要になる条件はephemeralcontainers/kustomization.yaml参照)
patches:
  - path: patches/check-deprecated-apis.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: check-deprecated-apis
  - path: patches/disallow-capabilities.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-capabilities|disallow-capabilities-ephemeralcontainers
  - path: patches/disallow-container-sock-mounts.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-container-sock-mounts
  - path: patches/disallow-default-namespace.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-default-namespace
  - path: patches/disallow-empty-ingress-host.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-empty-ingress-host
  - path: patches/disallow-host-namespaces.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-host-namespaces
  - path: patches/disallow-host-path.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-host-path
  - path: patches/disallow-host-ports.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-host-ports
  - path: patches/disallow-host-process.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-host-process|disallow-host-process-ephemeralcontainers
  - path: patches/disallow-latest-tag.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-latest-tag
  - path: patches/disallow-privileged-containers.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-privileged-containers|disallow-privileged-containers-ephemeralcontainers
  - path: patches/disallow-proc-mount.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-proc-mount|disallow-proc-mount-ephemeralcontainers
  - path: patches/disallow-selinux.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: disallow-selinux|disallow-selinux-ephemeralcontainers
  - path: patches/require-labels.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: require-labels
  - path: patches/require-requests-limits.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: require-requests-limits
  - path: patches/require-probes.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: require-pod-probes
  - path: patches/require-ro-rootfs.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: require-ro-rootfs
  - path: patches/restrict-nodeport.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: restrict-nodeport
  - path: patches/restrict-external-ips.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: restrict-external-ips
  - path: patches/restrict-seccomp.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: restrict-seccomp|restrict-seccomp-ephemeralcontainers
  - path: patches/restrict-sysctls.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: restrict-sysctls
  - path: patches/topologyspreadconstraints-policy.yaml
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: topologyspreadconstraints-policy
