apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/category: Security
spec:
  matchConstraints:
    # ValidatingPolicyはadmission webhookに加えてbackground scanからも評価される
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system # aws-vpc-cni-init/kube-proxy/ebs-csi-node(ebs-plugin)がprivileged: trueを使用
