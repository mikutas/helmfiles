apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: disallow-capabilities
  annotations:
    policies.kyverno.io/category: Security
spec:
  matchConstraints:
    # ValidatingPolicyはadmission webhookに加えてbackground scanからも評価される
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system # aws-node(aws-vpc-cni)がNET_ADMIN, NET_RAWを追加
            - linkerd # linkerd-destinationのlinkerd-initがNET_ADMIN, NET_RAWを追加
  variables:
    # linkerd-initはlinkerd.io/inject=enabledな全namespaceのPodにサイドカーとして
    # 注入されNET_ADMIN, NET_RAWを追加するため、namespace除外ではなくコンテナ名で除外する
    - name: allowedCapabilities
      expression: >-
        ['AUDIT_WRITE','CHOWN','DAC_OVERRIDE','FOWNER','FSETID','KILL','MKNOD','NET_BIND_SERVICE','SETFCAP','SETGID','SETPCAP','SETUID','SYS_CHROOT']
    - name: allContainers
      expression: >-
        (object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])).filter(container, container.name != 'linkerd-init')
