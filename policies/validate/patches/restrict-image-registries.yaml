apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/category: Security
spec:
  # variablesはリストごと置き換わるため、上流のpodSpec・allContainersもそのまま書く。
  variables:
    - name: podSpec
      expression: "object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : (has(object.spec.template) ? object.spec.template.spec : object.spec)"
    - name: allContainers
      expression: "variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]) + variables.podSpec.?ephemeralContainers.orValue([])"
    - name: allowed_registries
      expression: |
        [
          'cr.l5d.io',
          'docker.io',
          'ecr-public.aws.com',
          'ghcr.io',
          'public.ecr.aws',
          'quay.io',
          'reg.kyverno.io',
          'registry.k8s.io'
        ]
  validations:
    - expression: variables.allContainers.all(container,
          variables.allowed_registries.exists(registry, container.image.startsWith(registry + '/')))
      message: "Unknown image registry."
